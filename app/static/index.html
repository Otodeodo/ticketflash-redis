<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicketFlash</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">🎟️</span>
    <div>
      <h1>TicketFlash</h1>
      <small>Entradas con reservas temporales · Redis Cloud</small>
    </div>
  </div>
  <div class="conn" id="conn">Conectando…</div>
  <div class="session" id="session-box">
    <select id="user-select"><option value="">Selecciona usuario…</option></select>
    <button id="login-btn" class="btn primary">Iniciar sesión</button>
    <button id="new-user-btn" class="btn ghost" title="Crear usuario">＋ Usuario</button>
    <div id="session-info" class="hidden">
      <span id="session-user"></span>
      <span class="pill" title="TTL deslizante de la sesión en Redis">sesión expira en <b id="session-ttl">—</b></span>
      <button id="logout-btn" class="btn ghost">Salir</button>
    </div>
  </div>
</header>

<main class="layout">
  <section class="col events">
    <div class="section-head">
      <h2>Eventos</h2>
      <div class="filters">
        <select id="category-filter"><option value="">Todas las categorías</option></select>
        <button id="toggle-admin" class="btn ghost">＋ Nuevo evento</button>
      </div>
    </div>

    <form id="user-form" class="card form hidden">
      <h3>Nuevo usuario</h3>
      <div class="grid2">
        <label>Nombre <input id="us-name" required maxlength="80"></label>
        <label>Email <input id="us-email" type="email" required></label>
      </div>
      <div class="row">
        <button type="submit" class="btn primary">Crear</button>
        <button type="button" id="us-cancel" class="btn ghost">Cancelar</button>
      </div>
    </form>

    <form id="event-form" class="card form hidden">
      <h3 id="event-form-title">Nuevo evento</h3>
      <input type="hidden" id="ev-id">
      <div class="grid2">
        <label>Nombre <input id="ev-name" required maxlength="120"></label>
        <label>Recinto <input id="ev-venue" required maxlength="120"></label>
        <label>Fecha <input id="ev-date" type="datetime-local" required></label>
        <label>Categoría <input id="ev-category" required placeholder="musica, deporte…"></label>
        <label>Precio <input id="ev-price" type="number" min="0.01" step="0.01" required></label>
        <label id="ev-capacity-label">Capacidad <input id="ev-capacity" type="number" min="1" required></label>
      </div>
      <div class="row">
        <button type="submit" class="btn primary">Guardar</button>
        <button type="button" id="ev-cancel" class="btn ghost">Cancelar</button>
      </div>
    </form>

    <div id="events-list" class="cards"></div>
  </section>

  <aside class="col side">
    <div class="card">
      <h2>Mis reservas <span class="muted">(expiran en 10 min)</span></h2>
      <div id="holds-list" class="list"><p class="muted">Inicia sesión para ver tus reservas.</p></div>
    </div>
    <div class="card">
      <h2>Mis órdenes</h2>
      <div id="orders-list" class="list"><p class="muted">—</p></div>
    </div>
    <div class="card">
      <h2>🏆 Ranking de ventas</h2>
      <ol id="ranking-list" class="ranking"></ol>
    </div>
    <div class="card">
      <h2>Actividad reciente</h2>
      <ul id="activity-list" class="activity"></ul>
    </div>
    <div class="card stats">
      <h2>Claves en Redis por tipo</h2>
      <div id="keys-stats" class="chips"></div>
    </div>
  </aside>
</main>

<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
